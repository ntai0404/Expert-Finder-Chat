<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="zalo-platform-site-verification" content="My3kSBd4H2PUiiaYYerb3m2yo5JioXm9C3ar" />
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Beenet.vn - Săn sale đón lộc</title>
	<!-- Favicon -->
	<link rel="icon" href="assets/bot-logo.jpg" />
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
		crossorigin="anonymous" />
	<!-- Leaflet CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" crossorigin="" />
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- Material Icons (Google) -->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!-- Google Fonts: Inter -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="style.css?v=13" />
	<link rel="stylesheet" href="custom-header.css?v=14" />
</head>

<body>
	<div class="app-card container-fluid p-0">
		<div class="row h-100 g-0">
			<!-- Map Column: 40% height on mobile, 50% on desktop -->
			<div class="col-12 col-md-6 col-lg-6 map-area position-relative">
				<div id="map-container" class="h-100 w-100"></div>
			</div>

			<!-- Chat Column: 60% height on mobile, 50% on desktop -->
			<div class="col-12 col-md-6 col-lg-6 chat-area d-flex flex-column border-start">
				<div id="chat-container" class="d-flex flex-column h-100 bg-white">
					<!-- Chat Header -->
					<div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center">
						<h5 class="m-0">
							<img src="assets/bot-logo.jpg" alt="Beenet Logo" class="bot-logo-img" />Beenet.vn
						</h5>
						<div class="d-flex align-items-center gap-2">
							<small id="user-display" class="text-muted"></small>
							<button id="share-btn" class="btn btn-sm" title="Chia sẻ đoạn chat">
								<i class="material-icons" style="font-size: 18px; vertical-align: middle;">share</i>
								Chia sẻ
							</button>
							<button id="logout-btn" class="btn btn-sm btn-outline-danger" style="display: none">
								<i class="material-icons" style="font-size: 18px; vertical-align: middle;">logout</i>
								Đăng xuất
							</button>
						</div>
					</div>

					<!-- Share Modal (Bootstrap) -->
					<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel"
						aria-hidden="true">
						<div class="modal-dialog modal-dialog-centered">
							<div class="modal-content">
								<div class="modal-header">
									<h5 class="modal-title" id="shareModalLabel">🔗 Chia sẻ đoạn chat</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal"
										aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<p>Mọi người đều có thể xem và tiếp tục đoạn chat này thông qua link dưới đây:</p>
									<div class="input-group mb-3">
										<input type="text" id="share-link-input" class="form-control" readonly>
										<button class="btn btn-outline-primary" type="button" id="copy-share-link">
											<i class="material-icons"
												style="font-size: 18px; vertical-align: middle;">content_copy</i>
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Shared Mode Banner (Hidden by default) -->
					<div id="shared-mode-banner"
						class="alert alert-info border-0 rounded-0 m-0 d-flex justify-content-between align-items-center"
						style="display: none !important;">
						<span id="shared-banner-text"><i class="material-icons"
								style="vertical-align: middle; font-size: 18px;">info</i> Bạn
							đang xem đoạn chat được chia sẻ.</span>
						<button id="fork-chat-btn" class="btn btn-sm btn-primary">
							<i class="material-icons" style="vertical-align: middle; font-size: 18px;">fork_right</i>
							Chat tiếp
						</button>
					</div>

					<!-- Chat Messages -->
					<div id="chat-messages" class="flex-grow-1 p-3 overflow-auto"></div>

					<!-- Chat Input -->
					<div id="chat-input-area" class="p-3 border-top bg-light">
						<div class="input-group">
							<input type="text" id="chat-input" class="form-control" placeholder="Nhập tin nhắn..."
								aria-label="Message" />
							<button id="location-button" class="btn btn-outline-secondary" type="button"
								title="Gửi vị trí">
								<i class="material-icons">my_location</i>
							</button>
							<button id="send-button" class="btn btn-primary" type="button">
								<i class="material-icons">send</i>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Leaflet JS -->
	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
	<!-- Marked JS -->
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

	<!-- Custom JS -->
	<script src="avatar-display.js?v=24"></script>
	<!-- logout.js removed to prevent duplicate    <!-- Main Logic -->
	<script src="script_app.js?v=1.5"></script>
	<script>
		// DOM READY LOG
		document.addEventListener("DOMContentLoaded", function () {
			console.log("📦 DOM Content Loaded.");
		});

		// Log all fetch calls for debugging
		const originalFetch = window.fetch;
		window.fetch = function () {
			const url = arguments[0];
			console.log("🌐 FETCH:", url);
			return originalFetch
				.apply(this, arguments)
				.then((res) => {
					console.log("✅ OK:", url, res.status);
					return res;
				})
				.catch((err) => {
					console.error("❌ ERR:", url, err);
					throw err;
				});
		};
	</script>
</body>

</html>
